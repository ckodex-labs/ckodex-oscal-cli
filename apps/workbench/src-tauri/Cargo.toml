[package]
name = "mizan-desktop"
version = "0.1.0"
description = "Mizan OSCAL Compliance Desktop Workbench (Tauri)"
authors = ["mchorfa"]
license = "Apache-2.0"
repository = "https://github.com/ckodex-labs/ckodex-oscal-cli"
edition = "2021"

[workspace]

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
mizan-oscal = { path = "../../.." }
tauri = { version = "2.0", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
