name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v0.1.0)'
        required: true
        default: 'v0.1.0'

permissions:
  contents: write

jobs:
  build-binaries:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          - target: x86_64-apple-darwin
            os: macos-13
          - target: aarch64-apple-darwin
            os: macos-14
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    env:
      CC_x86_64_unknown_linux_musl: musl-gcc
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Linux build dependencies
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: Install NASM (Windows)
        if: matrix.os == 'windows-latest'
        uses: ilammy/setup-nasm@v1

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Determine Release Tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "RELEASE_TAG=${{ github.event.inputs.tag }}" >> $GITHUB_ENV
          else
            echo "RELEASE_TAG=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV
          fi

      - name: Build Release Binaries
        run: cargo build --release --target ${{ matrix.target }} --bin mizan --bin oscal-cli

      - name: Package Unix Binaries
        if: matrix.os != 'windows-latest'
        shell: bash
        run: |
          ARCHIVE_NAME="mizan-${RELEASE_TAG}-${{ matrix.target }}"
          PKG_DIR="dist/${ARCHIVE_NAME}"
          mkdir -p "${PKG_DIR}"
          cp "target/${{ matrix.target }}/release/mizan" "${PKG_DIR}/"
          cp "target/${{ matrix.target }}/release/oscal-cli" "${PKG_DIR}/"
          cp LICENSE "${PKG_DIR}/"
          cp README.md "${PKG_DIR}/"
          tar -czf "dist/${ARCHIVE_NAME}.tar.gz" -C dist "${ARCHIVE_NAME}"
          cd dist
          shasum -a 256 "${ARCHIVE_NAME}.tar.gz" > "${ARCHIVE_NAME}.tar.gz.sha256"

      - name: Package Windows Binaries
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          ARCHIVE_NAME="mizan-${RELEASE_TAG}-${{ matrix.target }}"
          PKG_DIR="dist/${ARCHIVE_NAME}"
          mkdir -p "${PKG_DIR}"
          cp "target/${{ matrix.target }}/release/mizan.exe" "${PKG_DIR}/"
          cp "target/${{ matrix.target }}/release/oscal-cli.exe" "${PKG_DIR}/"
          cp LICENSE "${PKG_DIR}/"
          cp README.md "${PKG_DIR}/"
          cd dist
          7z a "${ARCHIVE_NAME}.zip" "${ARCHIVE_NAME}"
          certutil -hashfile "${ARCHIVE_NAME}.zip" SHA256 | findstr -v "hash" | findstr -v "CertUtil" | tr -d '\r\n ' > hash.tmp
          echo "$(cat hash.tmp)  ${ARCHIVE_NAME}.zip" > "${ARCHIVE_NAME}.zip.sha256"

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
            dist/*.zip
            dist/*.zip.sha256

  publish:
    name: Publish Release Assets & Cryptographic Manifest
    needs: build-binaries
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine Release Tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "RELEASE_TAG=${{ github.event.inputs.tag }}" >> $GITHUB_ENV
          else
            echo "RELEASE_TAG=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV
          fi

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Generate Consolidated SHA256SUMS.txt
        working-directory: release-artifacts
        run: |
          cat *.sha256 > SHA256SUMS.txt
          echo "=== SHA256SUMS.txt ==="
          cat SHA256SUMS.txt

      - name: Upload Assets to GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd release-artifacts
          gh release view "${RELEASE_TAG}" || gh release create "${RELEASE_TAG}" --title "Mizan ${RELEASE_TAG}" --generate-notes
          for f in *.tar.gz *.zip SHA256SUMS.txt; do
            if [ -f "$f" ]; then
              echo "Uploading $f to release ${RELEASE_TAG}..."
              gh release upload "${RELEASE_TAG}" "$f" --clobber
            fi
          done

  build-oci:
    name: Build & Publish OCI Container
    needs: publish
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine Release Tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "RELEASE_TAG=${{ github.event.inputs.tag }}" >> $GITHUB_ENV
          else
            echo "RELEASE_TAG=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push OCI Image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ env.RELEASE_TAG }}
            ghcr.io/${{ github.repository }}:latest
