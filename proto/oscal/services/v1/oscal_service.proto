message UpdateProfileRequest {
  oscal.common.v1.UUID uuid = 1;
  oscal.profile.v1.Profile profile = 2;
}

message UpdateProfileResponse {
  oscal.profile.v1.Profile profile = 1;
}

message DeleteProfileRequest {
  oscal.common.v1.UUID uuid = 1;
}

message DeleteProfileResponse {
  bool success = 1;
}

// Component Definition Request/Response messages
message GetComponentDefinitionRequest {
  oscal.common.v1.UUID uuid = 1;
}

message GetComponentDefinitionResponse {
  oscal.component_definition.v1.ComponentDefinition component_definition = 1;
}

message ListComponentDefinitionsRequest {
