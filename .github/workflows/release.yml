name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build-binaries:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    env:
      CC_x86_64_unknown_linux_musl: musl-gcc
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Linux build dependencies
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: Install NASM (Windows)
        if: matrix.os == 'windows-latest'
        uses: ilammy/setup-nasm@v1

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Determine Release Tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "RELEASE_TAG=${{ github.event.inputs.tag }}" >> $GITHUB_ENV
          else
            echo "RELEASE_TAG=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV
          fi

      - name: Build Release Binaries
        run: cargo build --release --target ${{ matrix.target }} --bin mizan --bin oscal-cli

      - name: Package Unix Binaries
        if: matrix.os != 'windows-latest'
        shell: bash
        run: |
          ARCHIVE_NAME="mizan-${RELEASE_TAG}-${{ matrix.target }}"
          PKG_DIR="dist/${ARCHIVE_NAME}"
          mkdir -p "${PKG_DIR}"
          cp "target/${{ matrix.target }}/release/mizan" "${PKG_DIR}/"
          cp "target/${{ matrix.target }}/release/oscal-cli" "${PKG_DIR}/"
          cp LICENSE "${PKG_DIR}/"
          cp README.md "${PKG_DIR}/"
          tar -czf "dist/${ARCHIVE_NAME}.tar.gz" -C dist "${ARCHIVE_NAME}"
          cd dist
          shasum -a 256 "${ARCHIVE_NAME}.tar.gz" > "${ARCHIVE_NAME}.tar.gz.sha256"

      - name: Package Windows Binaries
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          ARCHIVE_NAME="mizan-${RELEASE_TAG}-${{ matrix.target }}"
          PKG_DIR="dist/${ARCHIVE_NAME}"
          mkdir -p "${PKG_DIR}"
          cp "target/${{ matrix.target }}/release/mizan.exe" "${PKG_DIR}/"
          cp "target/${{ matrix.target }}/release/oscal-cli.exe" "${PKG_DIR}/"
          cp LICENSE "${PKG_DIR}/"
          cp README.md "${PKG_DIR}/"
          cd dist
          7z a "${ARCHIVE_NAME}.zip" "${ARCHIVE_NAME}"
          sha256sum "${ARCHIVE_NAME}.zip" > "${ARCHIVE_NAME}.zip.sha256"

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
            dist/*.zip
            dist/*.zip.sha256

  publish:
    name: Publish Release Assets & Cryptographic Manifest
    needs: build-binaries
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine Release Tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "RELEASE_TAG=${{ github.event.inputs.tag }}" >> $GITHUB_ENV
          else
            echo "RELEASE_TAG=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV
          fi

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Generate Consolidated SHA256SUMS.txt
        working-directory: release-artifacts
        run: |
          cat *.sha256 > SHA256SUMS.txt
          echo "=== SHA256SUMS.txt ==="
          cat SHA256SUMS.txt

      - name: Attest Build Provenance (SLSA / Sigstore)
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            release-artifacts/*.tar.gz
            release-artifacts/*.zip
            release-artifacts/SHA256SUMS.txt

      - name: Upload & Publish Assets to GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd release-artifacts
          PRERELEASE_FLAG=()
          LATEST_FLAG=(--latest)
          case "${RELEASE_TAG}" in
            *-*)
              PRERELEASE_FLAG=(--prerelease)
              LATEST_FLAG=()
              ;;
          esac
          RELEASE_TITLE="Mizan ${RELEASE_TAG} · High-Assurance OSCAL Compliance Kernel & Workbench"
          if ! gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release create "${RELEASE_TAG}" \
              --verify-tag \
              --title "${RELEASE_TITLE}" \
              --generate-notes \
              "${PRERELEASE_FLAG[@]}" \
              "${LATEST_FLAG[@]}"
          fi
          for f in *.tar.gz *.zip *.sha256 SHA256SUMS.txt; do
            if [ -f "$f" ]; then
              echo "Uploading $f to release ${RELEASE_TAG}..."
              gh release upload "${RELEASE_TAG}" "$f" --clobber
            fi
          done
          # Guarantee the release is published (never stuck in Draft after re-tagging)
          gh release edit "${RELEASE_TAG}" \
            --draft=false \
            --tag "${RELEASE_TAG}" \
            --title "${RELEASE_TITLE}" \
            "${LATEST_FLAG[@]}"

      - name: Verify Unauthenticated Public Download Reachability
        shell: bash
        run: |
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/SHA256SUMS.txt"
          for attempt in 1 2 3 4 5; do
            if curl -fsSL "${URL}" | grep -q "mizan-${RELEASE_TAG}"; then
              echo "Verified public unauthenticated release asset access at ${URL}"
              exit 0
            fi
            sleep 3
          done
          echo "::error::Public unauthenticated download failed for ${URL} (is release still Draft?)"
          exit 1

  build-oci:
    name: Build OCI (${{ matrix.platform }})
    needs: publish
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux/amd64
            arch: amd64
          - os: ubuntu-24.04-arm
            platform: linux/arm64
            arch: arm64
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine Release Tag & Image Name
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "RELEASE_TAG=${{ github.event.inputs.tag }}" >> $GITHUB_ENV
          else
            echo "RELEASE_TAG=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV
          fi
          echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push native arch OCI image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: true
          tags: ghcr.io/${{ env.IMAGE_NAME }}:${{ env.RELEASE_TAG }}-${{ matrix.arch }}

  publish-oci-manifest:
    name: Publish Multi-Arch OCI Manifest
    needs: build-oci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Determine Release Tag & Image Name
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "RELEASE_TAG=${{ github.event.inputs.tag }}" >> $GITHUB_ENV
          else
            echo "RELEASE_TAG=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV
          fi
          echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push multi-arch OCI manifest
        shell: bash
        run: |
          docker buildx imagetools create \
            -t "ghcr.io/${IMAGE_NAME}:${RELEASE_TAG}" \
            -t "ghcr.io/${IMAGE_NAME}:latest" \
            "ghcr.io/${IMAGE_NAME}:${RELEASE_TAG}-amd64" \
            "ghcr.io/${IMAGE_NAME}:${RELEASE_TAG}-arm64"
