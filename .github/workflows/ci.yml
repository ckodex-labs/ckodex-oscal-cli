name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-core:
    name: Rust Core & Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Check Formatting
        run: cargo fmt --all -- --check

      - name: Clippy Linter
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Security & License Audit (cargo-deny)
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

      - name: Run Tests (168 Invariant & Integration Tests)
        run: cargo test --workspace

  dagger-pipeline:
    name: Dagger Rust SDK Pipeline Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Build Dagger Pipeline Crate
        run: cargo check -p mizan-dagger-ci

  workbench:
    name: Workbench UI & Desktop IPC
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/workbench/package-lock.json

      - name: Install Workbench Dependencies
        working-directory: apps/workbench
        run: npm ci

      - name: Lint Workbench TypeScript
        working-directory: apps/workbench
        run: npm run lint

      - name: Build Next.js 16 Workbench
        working-directory: apps/workbench
        run: npm run build

      - name: Install Linux GUI Dependencies for Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libglib2.0-dev libgtk-3-dev

      - name: Check Tauri Desktop Crate
        working-directory: apps/workbench/src-tauri
        run: cargo check
