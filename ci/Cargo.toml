[package]
name = "mizan-dagger-ci"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[dependencies]
dagger-sdk = "0.21.9"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
eyre = "0.6"
clap = { version = "4.5", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
