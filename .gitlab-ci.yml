# ==============================================================================
# Mizan · High-Assurance GitLab CI/CD Pipeline & Pages Portal
# ==============================================================================
image: rust:1.88-bookworm

stages:
  - test
  - build
  - deploy

variables:
  CARGO_HOME: "${CI_PROJECT_DIR}/.cargo"
  NPM_CONFIG_CACHE: "${CI_PROJECT_DIR}/.npm"

cache:
  key: "${CI_COMMIT_REF_SLUG}"
  paths:
    - .cargo/bin/
    - .cargo/registry/index/
    - .cargo/registry/cache/
    - .cargo/git/db/
    - target/
    - apps/workbench/node_modules/

# ------------------------------------------------------------------------------
# Stage 1: Rust Invariant Tests & Clippy
# ------------------------------------------------------------------------------
test:rust-core:
  stage: test
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends protobuf-compiler
    - rustup component add rustfmt clippy
  script:
    - cargo fmt --all -- --check
    - cargo clippy --workspace --all-targets -- -D warnings
    - cargo test --workspace

# ------------------------------------------------------------------------------
# Stage 2: Next.js 16 Workbench Lint & Build
# ------------------------------------------------------------------------------
test:workbench:
  stage: test
  image: node:22-bookworm-slim
  script:
    - cd apps/workbench
    - npm ci
    - npm run lint
    - npm run build

# ------------------------------------------------------------------------------
# Stage 3: Dagger Rust SDK Pipeline Verification
# ------------------------------------------------------------------------------
test:dagger-pipeline:
  stage: test
  script:
    - cargo check -p mizan-dagger-ci

# ------------------------------------------------------------------------------
# Stage 4: GitLab Pages Portal Deployment
# ------------------------------------------------------------------------------
pages:
  stage: deploy
  before_script:
    - apt-get update -qq && apt-get install -y -qq protobuf-compiler nodejs npm
  script:
    - chmod +x scripts/generate_pages.sh
    - ./scripts/generate_pages.sh
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
