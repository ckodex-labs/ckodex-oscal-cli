// Search Request/Response messages
message SearchRequest {
  string query = 1;
  repeated string model_types = 2;
  int32 page_size = 3;
  string page_token = 4;
}

message SearchResult {
  string model_type = 1;
  oscal.common.v1.UUID uuid = 2;
  string title = 3;
  double score = 4;
}

message SearchResponse {
  repeated SearchResult results = 1;
  string next_page_token = 2;
}
