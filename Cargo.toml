[package]
name = "mizan-oscal"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Mizan · High-Assurance OSCAL Compliance Kernel & Workbench (CLI, TUI, Tauri GUI)"
license = "Apache-2.0"
repository = "https://github.com/ckodex-labs/ckodex-oscal-cli"

[lib]
name = "mizan_oscal"
path = "src/lib.rs"

[[bin]]
name = "mizan"
path = "src/bin/mizan.rs"

[[bin]]
name = "oscal-cli"
path = "src/bin/oscal-cli.rs"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive", "env"] }
clap_complete = "4.6.8"
crossterm = "0.29"
directories = "6"
hex = "0.4"
jsonschema = "0.28"
prost = "0.14"
prost-types = "0.14"
prost-reflect = { version = "0.16", features = ["serde"] }
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm_0_29"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
similar = { version = "2.7", features = ["inline"] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time"] }
tonic = { version = "0.14.6", features = ["transport", "tls-webpki-roots", "tls-ring"] }
tonic-prost = "0.14.6"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1", features = ["v4"] }
regorus = "0.3"
kube = { version = "0.98", default-features = false, features = ["client", "rustls-tls", "derive"] }
k8s-openapi = { version = "0.24", default-features = false, features = ["v1_32"] }
notify = "8"

[build-dependencies]
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tonic-prost-build = "0.14.6"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
correctness = "deny"
suspicious = "warn"
style = "warn"
complexity = "warn"
perf = "warn"
